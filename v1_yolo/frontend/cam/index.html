<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL X — Caméra</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/jpeg" href="/logo.jpg">
</head>
<body>

<header>
  <div class="brand">
    <img src="/logo.jpg" alt="SentinelX">
    <h1>SENTINEL X</h1>
  </div>
  <p class="tagline">Voir avant — Agir à temps</p>
  <p>Devenir une caméra du réseau</p>
</header>

<main class="cam-main">
  <div id="codeStep">
    <label class="field-label" for="codeInput">Code de la caméra</label>
    <form id="codeForm" class="inline-form">
      <input type="text" id="codeInput" placeholder="ex: A1B2-C3D4" autocomplete="off" required>
      <button type="submit">Valider</button>
    </form>
    <p id="codeError" class="cam-info" hidden style="color:#ff8080;"></p>
  </div>

  <div id="camStep" hidden>
    <div class="cam-info">
      <b id="camName"></b> — <span id="camBuilding"></span>
    </div>

    <div class="stage" style="width:360px;">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <button id="toggle" style="margin-top:16px; width:100%;">Démarrer la caméra</button>
    <button id="forgetCode" class="danger" style="margin-top:10px; width:100%;">Changer de code</button>
  </div>
</main>

<script src="/notify.js"></script>
<script src="cam.js"></script>
</body>
</html>
