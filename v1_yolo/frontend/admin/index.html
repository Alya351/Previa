<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL X — Admin</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/jpeg" href="/logo.jpg">
</head>
<body>

<header>
  <div class="brand">
    <img src="/logo.jpg" alt="SentinelX">
    <h1>SENTINEL X — Admin</h1>
  </div>
  <p class="tagline">Voir avant — Agir à temps</p>
  <p>Gérer les bâtiments, points et caméras du réseau</p>
</header>

<main class="admin-main">
  <div class="panel wide">
    <label class="field-label">Nouveau bâtiment</label>
    <form id="buildingForm" class="inline-form">
      <input type="text" id="buildingName" placeholder="Nom du bâtiment" required>
      <button type="submit">Créer</button>
    </form>
  </div>

  <div id="buildingsList"></div>
</main>

<script src="/notify.js"></script>
<script src="admin.js"></script>
</body>
</html>
