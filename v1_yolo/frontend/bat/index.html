<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL X — Bâtiment</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/jpeg" href="/logo.jpg">
</head>
<body>

<div id="codeStep" class="cam-main" style="margin: 0 auto;">
  <header>
    <div class="brand">
      <img src="/logo.jpg" alt="SentinelX">
      <h1>SENTINEL X</h1>
    </div>
    <p class="tagline">Voir avant — Agir à temps</p>
    <p>Voir un bâtiment</p>
  </header>
  <label class="field-label" for="codeInput">Code du bâtiment</label>
  <form id="codeForm" class="inline-form">
    <input type="text" id="codeInput" placeholder="ex: A1B2-C3D4" autocomplete="off" required>
    <button type="submit">Valider</button>
  </form>
  <p id="codeError" class="cam-info" hidden style="color:#ff8080;"></p>
</div>

<div id="batStep" hidden>
  <header>
    <div class="brand">
      <img src="/logo.jpg" alt="SentinelX">
      <h1 id="buildingName">SENTINEL X</h1>
    </div>
    <p class="tagline">Voir avant — Agir à temps</p>
    <p>Toutes les caméras de ce bâtiment, en un seul regard</p>
  </header>

  <div class="tabs" style="max-width:1200px; margin:0 auto 20px;">
    <button type="button" id="tabCameras" class="active">Caméras</button>
    <button type="button" id="tabPeople">Gérer les personnes</button>
    <button type="button" id="openChat">💬 Chat</button>
  </div>

  <div id="camerasView">
    <p id="narration" class="narration">En attente de la première analyse...</p>
    <div id="camerasGrid" class="vision-grid" style="max-width:1200px; margin:0 auto;"></div>
  </div>

  <div id="peopleView" hidden style="max-width:1200px; margin:0 auto; width:100%;">
    <div id="peopleGrid" class="people-grid"></div>
  </div>
</div>

<div id="nameModal" class="modal-backdrop" hidden>
  <div class="modal">
    <img id="nameModalPhoto" alt="Photo de la personne détectée">
    <p id="nameModalPhotoFallback" class="photo-fallback" hidden>(photo indisponible)</p>
    <p>Il a l'air d'être une personne récurrente. Quel est son nom ?</p>
    <form id="nameForm">
      <input type="text" id="nameInput" placeholder="Nom" autocomplete="off" required>
      <button type="submit">Enregistrer</button>
    </form>
    <button type="button" id="markUnknownBtn" class="danger" style="width:100%; margin-top:8px;">Marquer comme inconnu</button>
  </div>
</div>

<script src="/notify.js"></script>
<script src="bat.js"></script>
</body>
</html>
