<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL X — Chat</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/jpeg" href="/logo.jpg">
</head>
<body>

<div id="codeStep" class="cam-main" style="margin: 0 auto;">
  <header>
    <div class="brand">
      <img src="/logo.jpg" alt="SentinelX">
      <h1>SENTINEL X</h1>
    </div>
    <p class="tagline">Voir avant — Agir à temps</p>
    <p>Discuter avec le bâtiment</p>
  </header>
  <label class="field-label" for="codeInput">Code du bâtiment</label>
  <form id="codeForm" class="inline-form">
    <input type="text" id="codeInput" placeholder="ex: A1B2-C3D4" autocomplete="off" required>
    <button type="submit">Valider</button>
  </form>
  <p id="codeError" class="cam-info" hidden style="color:#ff8080;"></p>
</div>

<div id="chatStep" hidden class="chat-page">
  <header>
    <div class="brand">
      <img src="/logo.jpg" alt="SentinelX">
      <h1 id="buildingName">SENTINEL X — Chat</h1>
    </div>
    <p class="tagline">Voir avant — Agir à temps</p>
    <p>Pose une question sur ce bâtiment — réponses basées uniquement sur les données réelles</p>
  </header>

  <div id="messages" class="chat-messages"></div>

  <form id="chatForm" class="inline-form chat-form">
    <input type="text" id="chatInput" placeholder="Tu vois Aiman ? Combien de caméras ?..." autocomplete="off" required>
    <button type="submit">Envoyer</button>
  </form>
</div>

<script src="/notify.js"></script>
<script src="chat.js"></script>
</body>
</html>
