<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL X — POC YOLO</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/jpeg" href="logo.jpg">
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.jpg" alt="SentinelX">
    <h1>SENTINEL X</h1>
  </div>
  <p class="tagline">Voir avant — Agir à temps</p>
  <p>Preuve de concept — chaîne de 5 modèles YOLO, chacun donne son avis</p>
</header>

<p id="narration" class="narration">En attente de la première analyse...</p>

<main>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="panel">
    <button id="toggle">Démarrer la caméra</button>

    <label class="upload">
      Envoyer une photo
      <input type="file" id="photoInput" accept="image/*" hidden>
    </label>

    <button id="resetFaces" class="danger">Réinitialiser les visages</button>

    <div class="stats">
      <div><span>FPS</span><b id="fps">–</b></div>
      <div><span>Latence</span><b id="latency">–</b></div>
      <div><span>Objets détectés</span><b id="count">–</b></div>
    </div>
    <div id="modelResults"></div>
  </div>
</main>

<div id="photoStage" class="photo-stage" hidden>
  <canvas id="photoCanvas"></canvas>
</div>

<div id="nameModal" class="modal-backdrop" hidden>
  <div class="modal">
    <img id="nameModalPhoto" alt="Photo de la personne détectée">
    <p id="nameModalPhotoFallback" class="photo-fallback" hidden>(photo indisponible)</p>
    <p>Il a l'air d'être une personne récurrente. Quel est son nom ?</p>
    <form id="nameForm">
      <input type="text" id="nameInput" placeholder="Nom" autocomplete="off" required>
      <button type="submit">Enregistrer</button>
    </form>
  </div>
</div>

<script src="notify.js"></script>
<script src="app.js"></script>
</body>
</html>
