# Sert le site construit (dist/) et redirige les routes API vers le
# backend — reprend exactement le rôle du proxy Vite utilisé en
# développement (voir frontend/web/vite.config.js pour la même liste de
# routes et l'explication complète du "pourquoi un seul proxy, jamais
# deux certificats à accepter"). `proxy_ssl_verify off` : le backend a
# un certificat auto-signé, c'est NOUS (nginx, hors du navigateur) qui
# lui parlons directement, pas le téléphone de l'utilisateur.
#
# `backend` (pas `127.0.0.1`) : nom du service dans docker-compose.yml,
# résolu automatiquement par le réseau Docker interne — marche pareil
# sur Linux/Mac/Windows (contrairement à network_mode: host, abandonné
# ici justement pour cette portabilité, voir docker-compose.yml).

# Laisse aussi passer la mise à niveau WebSocket (voir
# Infrastructure/signalisation_webrtc.py côté backend, .../direct/emettre
# et .../direct/regarder sous /cameras) à travers le MÊME bloc `location`
# que les requêtes HTTP classiques ci-dessous — `$connection_upgrade` vaut
# "upgrade" pour une requête WebSocket, "close" sinon (idiome nginx
# standard, voir la doc officielle du module proxy).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5173 ssl;
    listen [::]:5173 ssl;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Fichiers statiques (le build React) — repli sur index.html pour les
    # routes gérées côté client par react-router-dom (ex. /admin, /login).
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Routes réelles du backend (voir fonctionnalites/main/main.py) —
    # même liste que routesBackend dans vite.config.js.
    location ~ ^/(alarme|alertes|batiments|cameras|docs|openapi\.json|pieces|profils|redoc|static-docs|systeme|utilisateurs|vue-ensemble) {
        proxy_pass https://backend:8012;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Réponses d'images/flux caméra potentiellement volumineuses ou
        # lentes à générer (analyse IA) — pas de mise en mémoire tampon
        # intégrale avant de les relayer.
        proxy_buffering off;
        # Mise à niveau WebSocket (voir le `map` plus haut) — HTTP/1.1
        # requis, la mise à niveau ne marche pas en HTTP/1.0.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Une connexion WebSocket reste ouverte tant que la caméra
        # émet/que quelqu'un regarde — le délai par défaut (60s
        # d'inactivité) la couperait sinon.
        proxy_read_timeout 3600s;
    }
}

# Accès HTTP simple (sans TLS), même API que ci-dessus — dédié à l'app
# mobile (Expo Go / build de développement react-native-webrtc). Un
# navigateur laisse l'utilisateur "continuer quand même" face à notre
# certificat auto-signé ; le client mobile, lui, n'a aucune UI pour ça
# et rejette silencieusement toute requête HTTPS vers ce certificat
# (voir mobile/api.js). Le web (port 5173) reste intégralement en
# HTTPS/WSS, inchangé — ce bloc ne sert QUE le client mobile en phase de
# test sur réseau local. Mise à niveau WebSocket incluse (même `map`
# plus haut) : nécessaire pour la signalisation WebRTC
# (.../direct/regarder, voir mobile/lib/useFluxDirect.js) exactement
# comme pour le web.
server {
    listen 8080;
    listen [::]:8080;

    location ~ ^/(alarme|alertes|batiments|cameras|docs|openapi\.json|pieces|profils|redoc|static-docs|systeme|utilisateurs|vue-ensemble) {
        proxy_pass https://backend:8012;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
